ight": "170px / 205px / 213px（字高比 0.680 / 0.820 / 0.852，小字号同比）", "sceneTitleLetterSpacing": "-0.02em（-5px @ 250px）", "sceneTitleTransform": "uppercase（全大写）", "sceneTitleWeight": "400 / 500", "displayFont": "原站 Ringold（商用）→ 免费替代 system-ui / Helvetica Neue", "bodySize": "20px"}, "spacing": {"sceneMinHeight": "整屏（每幕 766~1209px 高）", "colorBlockWidth": "1278px（视口 1280，即满宽）", "buttonPadding": "23px 40px", "buttonRadius": "16px"}, "motion": {"duration": "站点自有 @keyframes 共 25 个，逐个取到时长的 4 个：0.4s / 2.25s / 1.4s / 1s", "easing": "cubic-bezier(0.5, 0, 0, 1)、ease、ease-in-out、step-end", "trigger": "以 class 切换 / hover / 进入视口为主，非自动播放"}}, "api": "引入 src/scenes.css 后：每幕一个 <section class=\"scene s1\">，标题 <h2 class=\"scene__title\">，文本中的换行用真实换行（white-space: pre 保留）。用 CSS 变量控场：--bg 幕底色、--fg 字色、--fs 字号、--lh 行高比、--fw 字重；新增一幕只需加一个 .sN 类并给这几个变量。角标 .scene__spec 把该幕的实测参数写在画面上。", "entrypoints": ["src/scenes.css"], "files": ["demo/index.html", "src/scenes.css", "shots/original-site.png", "shots/demo.png"], "deps": [], "reuse_hints": "适合：品牌/活动/电商首屏、需要「一句话当主视觉」的落地页、章节式滚动叙事、展会/菜单/唱片等以文字为主体的场景。别用：需要连续阅读的正文页、信息密度高的后台、中文长标题（强制断行对中文不成立）、需要小尺寸呈现的场景（这套装置的全部力量来自尺度）。", "repro_notes": "①本条原被误记为「糖果配色主题」，2026-10-11 复盘后改名并改轴（theme → typography）：分类轴只是发现它的搜索面，不决定条目写什么。②`getAnimations().length === 0` 在本站成立，但那只是「采样时刻无运行动画」，不代表站点静态——站内实测有 25 个 @keyframes 与 147 处 transition 声明，动效以 class / hover / 进入视口触发。③25 个 keyframe 中有 2 个（onetrust-fade-in、ot-go-spin）来自第三方 OneTrust cookie 组件，不计入站点设计。④色值由 rgb() 归一化为 hex。⑤字号同时用 vw 与 svh 双约束是复刻时的必要修正：只用 vw 会在矮窗口把多行字块裁掉（实测 6 行 × 250px = 1278px > 577px 视口）。⑥demo 的入场揭示是本 demo 自加的（CSS 滚动驱动动画），原站揭示机制未取证 → [未验证]。", "variant_of": null, "verification": {"rendered_ok": true, "console_errors": 0, "screenshot": "shots/demo.png", "checked_at": "2026-10-11T11:20:00+08:00", "note": "demo 在 4 个视口实测（1280×577 / 1440×900 / 1920×1080 / 390×844）：全部零横向溢出、零纵向溢出；行高比实测 0.836 / 0.852 / 0.820 / 0.852 / 0.680 / 0.833 与设定一致；控制台 0 报错、0 个外部网络请求；CSS.supports('animation-timeline','view()') 为 true（不支持时退化为静止呈现）。shot <script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const entries = DATA.entries || [];
  const failed = DATA.failed || [];

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const isColor = v => /^(#[0-9a-f]{3,8}|rgb|hsl|oklch|lab|color\()/i.test(String(v || '').trim());
  const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  // 判断类字段（机制/表达/别照搬…）里可能带 markdown 强调符，渲染前剥掉，不要露出 ** 
  const txt = s => esc(String(s == null ? '' : s).replace(/\*\*/g, ''));
  const pad = n => String(n).padStart(2, '0');
  const NO_VALUE = v => !v || v === '—';

  // ---------- 统计 ----------
  const cats = {};
  entries.forEach(e => { const c = e.category || '(未分类)'; cats[c] = (cats[c] || 0) + 1; });
  const catsSorted = Object.keys(cats).sort((a, b) => cats[b] - cats[a]);
  const noDeps = entries.filter(e => !(e.deps || []).length).length;
  const mechs = new Set(entries.map(e => e.extracted_mechanism)).size;

  document.getElementById('updated').textContent = (DATA.generated_at || '').replace('T', ' ').slice(0, 16);
  document.getElementById('stat').textContent =
    entries.length + ' 条 · ' + catsSorted.length + ' 类别 · ' + noDeps + ' 条零依赖';
  document.getElementById('stats').innerHTML = [
    ['条目', entries.length], ['类别', catsSorted.length],
    ['零依赖', noDeps], ['不重复机制', mechs]
  ].map(([k, v]) => '<div><dt>' + k + '</dt><dd class="mono">' + v + '</dd></div>').join('');

  // ---------- 字段渲染（空值整行不渲染，不留破折号占位） ----------
  const NONE = '<span class="meta__v--none">本条目无此项</span>';
  const row = (k, v, cls) => '<div class="meta__row' + (cls ? ' ' + cls : '') + '"><span class="meta__k">' + k + '</span><p class="meta__v">' + v + '</p></div>';

  function swatches(tokens) {
    const colors = (tokens && tokens.colors) || {};
    const keys = Object.keys(colors);
    if (!keys.length) return '';
    return keys.map(k => {
      const v = colors[k];
      return isColor(v)
        ? '<span class="sw" title="' + esc(k + ': ' + v) + '" style="background:' + esc(v) + '"></span>'
        : '<span class="tag">' + esc(v) + '</span>';
    }).join('');
  }
  function motionText(tokens) {
    const m = (tokens && tokens.motion) || {};
    const p = [];
    if (m.duration) p.push('时长 ' + m.duration);
    if (m.easing) p.push('缓动 ' + m.easing);
    if (m.trigger) p.push('触发 ' + m.trigger);
    return p.length ? p.join(' · ') : '';
  }
  function typeText(tokens) {
    const t = (tokens && tokens.typography) || {};
    const k = Object.keys(t);
    return k.length ? k.map(x => x + ' ' + t[x]).join(' · ') : '';
  }
  function depsText(deps) {
    if (!deps || !deps.length) return '<span class="tag tag--none">零依赖</span>';
    return deps.map(d => '<span class="tag tag--dep" title="' + esc(d.why || '') + '">' +
      esc(d.name || d) + (d.version ? ' ' + esc(d.version) : '') + '</span>').join(' ');
  }

  // ---------- 展品卡 ----------
  function plate(e, i) {
    const media = e.shot
      ? '<img src="' + esc(e.shot) + '" alt="" loading="lazy" onerror="this.remove()">'
      : '<span class="ph">无截图证据</span>';

    // 主干信息：判断优先（机制 / 视效表达 / 别照搬），缺值也占行 → 三张卡基线一致
    const mc = e.motion_catalog || [];
    const sw = swatches(e.tokens);
    const mo = motionText(e.tokens);
    const rows = [
      row('机制', '<span class="meta__v--clamp">' + txt(e.extracted_mechanism) + '</span>'),
      row('视效表达', e.expression ? '<span class="meta__v--clamp">' + txt(e.expression) + '</span>' : NONE),
      row('别照搬', e.dont_copy ? txt(e.dont_copy) : NONE, 'meta__row--flag')
    ];

    // 参数与证据折叠：这些是佐证，不是重点
    const more = [];
    if (e.composition) more.push(row('构图', txt(e.composition)));
    if (mc.length) more.push(row('动效清单', '<span class="mono">' + mc.length + ' 条</span> ' +
      mc.slice(0, 12).map(m => '<span class="tag" title="' + esc([m.duration, m.easing, m.trigger].filter(Boolean).join(' · ')) + '">' +
        esc(m.name || '?') + '</span>').join(' ')));
    more.push(row('配色', sw ? '<span class="swatches">' + sw + '</span>' : NONE));
    const ty = typeText(e.tokens);
    if (ty) more.push(row('排版', '<span class="mono">' + esc(ty) + '</span>'));
    if (mo) more.push(row('动效参数', '<span class="mono">' + esc(mo) + '</span>'));
    more.push(row('依赖', depsText(e.deps)));
    if (e.reuse_hints) more.push(row('适用', txt(e.reuse_hints)));
    if (e.repro_notes) more.push(row('复核要点', txt(e.repro_notes)));
    if ((e.tags || []).length) {
      more.push(row('原站标签', e.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join(' ')));
    }

    const node = el(
      '<article class="plate" style="--pi:' + i + '">' +
        '<div class="plate__media" data-src="' + esc(e.demo) + '">' +
          '<span class="plate__idx">' + pad(i + 1) + '</span>' + media +
          '<button class="plate__load" type="button">载入实时预览</button>' +
        '</div>' +
        '<div class="plate__head">' +
          '<div class="plate__sub">' +
            '<span class="label accent">' + esc(e.strength || e.category || '') + '</span>' +
            '<span class="label">' + esc(e.date || '') + '</span>' +
            '<span class="label">轴 ' + esc(e.category || '') + '</span>' +
            (e.author ? '<span class="label">' + esc(e.author) + '</span>' : '') +
          '</div>' +
          '<h2 class="plate__title">' + esc(e.title || e.id) + '</h2>' +
        '</div>' +
        '<dl class="meta">' + rows.join('') + '</dl>' +
        (more.length ? '<details class="plate__more"><summary>构图 · 动效清单 · 参数与证据<span class="label">' +
                       more.length + '</span></summary><dl class="meta">' + more.join('') + '</dl></details>' : '') +
        '<div class="plate__foot">' +
          '<span class="plate__id" title="条目目录名">' + esc(e.id) + '</span>' +
          '<span class="go">' +
            '<a class="is-primary" href="' + esc(e.demo) + '" target="_blank" rel="noopener">打开 demo</a>' +
            (e.source_url ? '<a href="' + esc(e.source_url) + '" target="_blank" rel="noopener">原站</a>' : '') +
            (e.awwwards_url ? '<a href="' + esc(e.awwwards_url) + '" target="_blank" rel="noopener">Awwwards</a>' : '') +
            '<a href="' + esc(e.readme) + '">README</a>' +
          '</span>' +
        '</div>' +
      '</article>');

    // 预览默认是截图；点按钮才换成实时 iframe（截图轻、且没有内部滚动条）
    node.querySelector('.plate__load').addEventListener('click', function () {
      const box = node.querySelector('.plate__media');
      const img = box.querySelector('img');
      const iframe = document.createElement('iframe');
      iframe.src = box.dataset.src;
      iframe.title = 'demo 实时预览';
      box.insertBefore(iframe, box.querySelector('.plate__load'));
      if (img) img.remove();
      this.remove();
    });

    node.dataset.hay = [e.id, e.title, e.author, e.category, e.summary, e.extracted_mechanism,
      e.reuse_hints, (e.tags || []).join(' ')].join(' ').toLowerCase();
    node.dataset.cat = e.category || '(未分类)';
    return node;
  }

  const grid = document.getElementById('grid');
  const nodes = entries.map((e, i) => { const n = plate(e, i); grid.appendChild(n); return n; });

  // ---------- 筛选 ----------
  const chips = document.getElementById('chips');
  const active = new Set();
  catsSorted.forEach(c => {
    const b = el('<button class="chip" type="button" aria-pressed="false">' + esc(c) +
                 '<span class="chip__n">' + cats[c] + '</span></button>');
    b.onclick = () => {
      if (active.has(c)) active.delete(c); else active.add(c);
      b.setAttribute('aria-pressed', active.has(c));
      apply();
    };
    chips.appendChild(b);
  });

  const q = document.getElementById('q');
  const empty = document.getElementById('empty');
  function apply() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    nodes.forEach(n => {
      const ok = (active.size === 0 || active.has(n.dataset.cat)) && (!term || n.dataset.hay.includes(term));
      n.hidden = !ok;
      if (ok) shown++;
    });
    if (!entries.length) {
      empty.hidden = false;
      empty.innerHTML = '<p class="h3">库里还没有条目</p>' +
        '<p class="small">先跑一次任务：<br><code>python3 scripts/new_entry.py "slug" --category motion</code><br>' +
        '<code>python3 scripts/build_gallery.py</code></p>';
    } else if (shown === 0) {
      empty.hidden = false;
      empty.innerHTML = '<p class="h3">没有匹配的条目</p><p class="small">换个关键词，或清掉分类筛选。</p>';
    } else {
      empty.hidden = true;
    }
  }
  q.addEventListener('input', apply);

  // ---------- 未入库 ----------
  if (failed.length) {
    const box = document.getElementById('failed');
    box.hidden = false;
    box.innerHTML = '<h2>未入库 ' + failed.length + ' 条</h2>' +
      '<ul>' + failed.map(f => '<li><span class="mono">' + esc(f.dir) + '</span> — ' + esc(f.reason) + '</li>').join('') + '</ul>';
  }
})();
</script>
</body>
</html>
