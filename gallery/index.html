alog-in-use.png"], "deps": [], "reuse_hints": "适合：内容索引/编目/作品集/文档/杂志类界面，以及任何「内容比装饰重要」的展示页——本项目自身的画廊页就复用了它（gallery/index.html 直接 link 本条的 src/theme.css，是库内第一条被自己消费的条目）。别用：需要沉浸暗色、强科技感、游戏化或高饱和品牌表达的产品界面（纸墨底色会压制这类气质）；强调色只有一个，若项目需要多主色需自行扩展变量。", "repro_notes": "全部数值取自 https://metic.studio/en 的浏览器计算样式（getComputedStyle / document.getAnimations），非目测。复核要点：①颜色直接读 body 与元素的 backgroundColor/color 出现频次（纸底 rgb(244,244,242) 出现 152 次、墨 rgb(18,18,20) 726 次、次要 rgb(98,98,106) 305 次、强调 rgb(255,62,62) 88 次）；②强调色用途可用「统计所有元素里等于 rgb(255,62,62) 的 color/backgroundColor/borderColor/outlineColor」复核，实测各有 44~47 处；③细线是 1px rgba(18,18,20,0.12)，实测 42 处，另有 1px rgb(98,98,106) 13 处作加重变体；④区段纵向 padding 实测 160px（部分 128px），12 栏网格 gap 40px；⑤动效实测 1050ms linear，错峰 120/210/300ms（步长 90ms）以及 -400/-750/-550ms 的负延迟组。字体：原站 Bricolage Grotesque + Space Grotesk（均为免费字体），本主题为「零外网依赖」只在 font-family 里声明字体名 + 系统回退，不引 CDN；本地装了这两款免费字体即自动生效。", "variant_of": null, "verification": {"rendered_ok": true, "console_errors": 0, "screenshot": "shots/demo.png", "checked_at": "2026-10-11T11:05:00+08:00", "note": "file:// 打开 demo 与 gallery/index.html 均实测：控制台 0 报错、0 个外部网络请求；gallery 复用本条 theme.css 渲染出抬头/统计/筛选/展品卡；字体在未安装 Bricolage/Space Grotesk 的环境下按预期回退 system-ui，结构不变；prefers-reduced-motion 降级为瞬时。"}}, {"id": "2026-10-11-giant-type-scenes", "date": "2026-10-11", "schema_version": 1, "verification_tier": "legacy-self-report", "category": "typography", "source": {"awwwards_url": "https://www.awwwards.com/sites/ring-pop-r-candy", "live_url": "https://ringpopcandy.com/", "title": "Ring Pop® Candy", "author": "", "award_date": "", "tags": ["e-commerce", "colorful", "microinteractions", "scrolling", "storytelling", "shopify", "figma"]}, "title": "Ring Pop® Candy", "author": "", "tags": ["e-commerce", "colorful", "microinteractions", "scrolling", "storytelling", "shopify", "figma"], "dir": "entries/2026-10-11-giant-type-scenes", "demo": "../entries/2026-10-11-giant-type-scenes/demo/index.html", "readme": "../entries/2026-10-11-giant-type-scenes/README.md", "spec": "../entries/2026-10-11-giant-type-scenes/SPEC.json", "source_url": "https://ringpopcandy.com/", "awwwards_url": "https://www.awwwards.com/sites/ring-pop-r-candy", "shot": "../entries/2026-10-11-giant-type-scenes/shots/demo.png", "shot_kind": "demo", "summary": "巨字 × 满幅图分幕：底色恒定（奶油 #FFF7E9），每幕一张满幅产品图当色场，巨字压在图上面；字色跟着图挑（粉字配桃底、萤光黄配蓝底）。文字本身带三层效果：逐词遮罩上抽的揭示、词级局部换色、画出来的下划线。", "strength": "type-as-image", "expression": "三层叠起来才是它的看点。①**字压图**：标题不是摆在图旁边，而是**压在图上面**——实测标题中心点调用 document.elementsFromPoint 命中的最上层是 picture.mfr-responsive-image，即产品图就是字的底。所以「配色方案」这个说法是偏的：全站底色恒定为 rgb(255,247,233) 不变，每幕的「色」来自那张满幅产品图（实测宽 1278px ≈ 视口宽，高 863~1490px），**真正逐幕变化的是字色，而字色是跟着图挑的**（粉 #E8588A 配桃底、萤光黄 #E0FF18 配蓝底、柠檬 #64F525、黄 #FFF200）。②**文字效果**（静态首屏量不到）：标题被拆成**逐词块**——div.split-text > span.split-text__inner，外层 overflow:hidden 当遮罩，未进入视口时 opacity:0 + transform:translateY(min(100%,80px))，JS 加上 .is-inview 后归位 → 巨型词块**逐词从下往上抽出来**，天然可逐词错峰；标题内可**局部换色**（.section-title .highlighted / b / strong → color: var(--highlight-color)，另有 .has-gradient-highlight 渐变）；**下划线是画出来的小条**而不是 border（strong::after { height: 0.025em; background: var(--underline-color) }）。③**层级靠极端对比**：kicker 16px 与巨字 250px = 15.6 倍字号差，同一色系里做极小+极大；分幕之间用 box-shadow: 0 -30px 40px 制造层叠感（.as-stacking-section--shadow）。", "composition": "实测（视口 1280×577）：body 底色 rgb(255,247,233) 全站恒定；14 个 section，10 个 .section-title（其中 5 个带 .as-stacking-section，高度 863 / 882 / 942 / 839 / 859px）；字号 250px（6 段）/ 160 / 128 / 120 / 102px；行高比 0.680~0.852（250/170、250/205、250/213、120/100、102/86、128/107、160/115）；字距 -0.02em；全大写；真实 h1 为 visually-hidden。满幅图宽 1278px（= 视口宽）、高 863~1490px。kicker（.small-title）16px。页面总高 11047px。", "highlights": [], "selected_fragment": {}, "evidence": [], "motion_catalog": [{"name": "split-text 逐词遮罩揭示", "duration": "", "easing": "", "delay": "", "trigger": "进入视口时 JS 加 .is-inview（未进入：opacity 0 + translateY(min(100%, 80px))）"}, {"name": "floating", "duration": "", "easing": "", "delay": "", "trigger": "无限循环：0% translateY(0) → 65% translateY(15px) → 100% translateY(0)"}, {"name": "floating-reverse", "duration": "", "easing": "", "delay": "", "trigger": "同上，-15px"}, {"name": "shadow-blur", "duration": "", "easing": "", "delay": "", "trigger": "无限循环：0% blur(1.3rem) grayscale(1) brightness(0) + scale(1) skew(30deg,-4deg) → 65% blur(0.8rem) + scale(0.85) + 同斜切 → 100% 回位（随悬浮物缩小）"}, {"name": "spark", "duration": "3s", "easing": "ease-in-out", "delay": "0s", "trigger": "无限循环：scale 0 → 1 → 0"}, {"name": "spark-fast", "duration": "2s", "easing": "ease-in-out", "delay": "0s", "trigger": "同上，更快"}, {"name": "rotating", "duration": "26s", "easing": "linear", "delay": "0s", "trigger": "无限循环：rotate 0→360（另有 .rotating-slow）"}, {"name": "pulsate", "duration": "", "easing": "", "delay": "", "trigger": "无限循环：scale 1 → 0.7 → 1"}, {"name": "tada", "duration": "", "easing": "", "delay": "", "trigger": "扭动：scaleX(1) → scale3d(0.9,0.9,0.9) rotate(-3deg) → scale3d(1.1,1.1,1.1) rotate(3deg) 交替"}, {"name": "flying", "duration": "", "easing": "", "delay": "", "trigger": "left -5% → 65% 70% → 110%（横穿）"}, {"name": "waveAnimation", "duration": "", "easing": "", "delay": "", "trigger": "background-position-x 0 → 200%（背景波）"}, {"name": "dash", "duration": "1.4s", "easing": "ease-in-out", "delay": "0s", "trigger": "无限循环：stroke-dashoffset 280 → 75 且 rotate(135deg) → 280 且 rotate(450deg)"}, {"name": "arrow-move", "duration": "", "easing": "", "delay": "", "trigger": "translate(-100%) → translate(100%)（箭头穿梭）"}, {"name": "right-to-left-marquee / left-to-right-marquee", "duration": "", "easing": "", "delay": "", "trigger": "translate(0) ↔ translate(-50%)"}, {"name": "animateMenuOpen", "duration": "0.4s", "easing": "cubic-bezier(0.5, 0, 0, 1)", "delay": "0s", "trigger": "点击开菜单"}, {"name": "hover 状态（导航/图标）", "duration": "", "easing": "", "delay": "", "trigger": ".header-menu__title:hover span::after { transform: scaleX(1) }（下划线展开）／ .header__search-trigger:hover { transform: scale(1.25); filter: drop-shadow(...) } 且其六边形图标 rotate(180deg)／ .cover-image:hover { scale(1.05) }"}], "extracted_mechanism": "巨字压满幅图的分幕装置：底色恒定不变，每幕用一张满幅图当色场，巨字块直接压在图上层（字色从图里挑）；字块由「逐词拆字 + 外层 overflow:hidden 遮罩」构成，未进入视口时 opacity:0 + translateY(min(100%,80px))，进入后逐词归位形成上抽揭示；层级靠 kicker 16px 与巨字 250px 的 15.6 倍字号差建立；分幕之间以上投影制造层叠感。", "dont_copy": "四条：①**配色本身不精致，别把它的色板当范本**——8 个高饱和原色并置并不好看，它成立是因为色块被放大到满幅、与 250px 巨字并置，靠尺度压住了艳度；抄到小尺寸界面会立刻显廉价。②**全大写 + 强制换行牺牲可读性**：一字母一行只对短英文词成立，中文、德文长词、需要连续阅读的段落都不适用。③**首屏文字全部依赖 JS 揭示**：文字初始 opacity:0，若脚本失败或爬虫/预览不执行 JS，正文是隐形空白的（本 demo 用 html.js 做渐进增强规避，但原站没做）。④**强依赖商用字体与大幅产品摄影**：原站用 Ringold（商用）与大量商品图，代码复刻只能以系统无衬线 + 纯色场替代，观感必然打折。", "tokens": {"colors": {"ground": "#FFF7E9", "ink": "#141723", "pink": "#E8588A", "neon": "#E0FF18", "yellow": "#FFF200", "lime": "#64F525", "deep": "#38292B", "field-blue": "#1F5FE0"}, "typography": {"sceneTitleSize": "250px / 160px / 128px / 120px / 102px（逐幕变化，实测）", "sceneTitleLineHeight": "170 / 205 / 213px（行高比 0.680 / 0.820 / 0.852，小字号同比）", "sceneTitleLetterSpacing": "-0.02em（-5px @ 250px）", "sceneTitleTransform": "uppercase", "kickerSize": "16px（与巨字 250px 差 15.6 倍）", "highlightColor": "var(--highlight-color)，用于标题内 .highlighted / b / strong 的局部换色", "underline": "strong::after 画出的 0.025em 高小条，色走 var(--underline-color)", "displayFont": "原站 Ringold（商用）→ 免费替代 system-ui / Helvetica Neue"}, "spacing": {"sceneHeight": "整屏（实测 839 / 859 / 863 / 882 / 942px）", "fullBleedWidth": "1278px（视口 1280，即满宽）", "stackingShadow": "0 -30px 40px rgba(0,0,0,.25)（分幕层叠感）", "revealOffset": "translateY(min(100%, 80px))"}, "motion": {"duration": "站点自有 @keyframes 共 25 个；逐个取到时长的 4 个：0.4s / 2.25s / 1.4s / 1s", "easing": "linear、ease-in-out、cubic-bezier(0.5,0,0,1)、step-end", "trigger": "以「进入视口加 .is-inview」与 hover 状态为主，非自动播放"}}, "api": "引入 src/scenes.css；每幕一个 section.scene + section.scene__field（色场）；标题里**每个词**包一层 .word > .word__in（.word 提供 overflow:hidden 遮罩，故每词独占一行）。变量：--field 场色、color 字色、--fs 字号、--lh 行高比、--highlight-color 局部高亮色、--underline-color 下划线色、--i 词序号（决定错峰延迟）。揭示由 demo 里 12 行脚本加 .is-inview 触发；未启用 JS 时（html 上没有 .js）词直接可见。", "entrypoints": ["src/scenes.css"], "files": ["demo/index.html", "src/scenes.css", "shots/original-site.png", "shots/demo.png"], "deps": [], "reuse_hints": "适合：品牌/活动/电商首屏、需要「一句话当主视觉」的落地页、章节式滚动叙事、展会/菜单/唱片等以文字为主体的场景；尤其适合「有大幅产品图/摄影素材可当色场」的品牌。别用：需要连续阅读的正文页、信息密度高的后台、中文长标题（强制换行对中文不成立）、需要小尺寸呈现的场景（力量全来自尺度）、以及没有 JS 也要保证正文可见的页面（除非照本 demo 做渐进增强）。", "repro_notes": "①本条被复写过三版，v1 误记为「糖果配色主题」、v2 只改了轴与字段、v3（本条）才挖到真机制：原因是我一直在量「好测量的东西」（色值/字号），而它的看点在于**层叠关系与状态**。②**别把满幅图自带的大色块当成站点的配色方案**：全站底色恒为 rgb(255,247,233)，蓝/红等都是产品图自己的底色；取样时要把「图片」与「CSS 背景」分开（可用 document.elementsFromPoint 看字底下压着什么、用 img 的几何尺寸判断是否满幅）。③文字效果只在**状态切换**时可见，必须主动触发：枚举状态类名（.is-inview / .aos-animate / [split-text=\"fadeUp\"]）并对比状态前后的计算样式，静态首屏量不到。④@keyframes 要取**正文**（名字只是索引）：本条已拿到 floating / shadow-blur / spark / tada / flying / waveAnimation / dash / arrow-move / marquee 的关键帧原文；25 个里 2 个（onetrust-fade-in、ot-go-spin）属第三方 OneTrust cookie 组件，不计入。⑤`getAnimations().length === 0` ≠ 静态站点（本条站内有 25 个 keyframes + 147 处 transition）。⑥复刻时踩到两个真坑，都写在了 src/scenes.css 注释里：**容器上的 overflow:hidden 会变成滚动容器，使子元素的 view() 时间线以该容器为 scrollport**（改 overflow:clip）；**IntersectionObserver 对被跳滚跳过的元素不回调**（实测跳到底部只揭开 3/17 个词，改用 rAF 节流的滚动位置检查）。⑦色值由 rgb() 归一化为 hex。", "variant_of": null, "verification": {"rendered_ok": true, "console_errors": 0, "screenshot": "shots/demo.png", "checked_at": "2026-10-11T12:45:00+08:00", "note": "demo 在 4 个视口实测（1440×900 / 1280×577 / 1920×1080 / 390×844）：标题零横向溢出、零纵向溢出；控制台 0 报错。揭示机制实测：顶部 1 个词已揭示、其余 16 个 opacity 0 且**视口内无未揭示元素**；直接跳到底部 17/17 全部揭示（跳滚不漏）；缓滚一遍后 17/17 opacity 1；回顶无空白词。floating / shadow-blur / spark 关键帧按原站原文复刻并常驻循环。字号取「宽度约束（最长单词字符数）」与「高度约束（行数 × 行高比）」的较小值，已按实测字形推进 0.588em/字符 反推。"}}], "failed": []}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const entries = DATA.entries || [], failed = DATA.failed || [];
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const txt = s => esc(String(s == null ? '' : s).replace(/\*\*/g,''));
  const el = html => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
  const arr = v => Array.isArray(v) ? v : [];
  const pad = n => String(n).padStart(2,'0');
  const NONE = '<span class="meta__v--none">未记录</span>';
  const status = s => ({observed:'实际观察', 'source-supported':'源码支持', inferred:'推断', unknown:'未验证', pass:'通过', fail:'失败', unverified:'未验证'}[s] || '未记录');
  const row = (k,v,cls) => '<div class="meta__row'+(cls?' '+cls:'')+'"><span class="meta__k">'+esc(k)+'</span><div class="meta__v">'+v+'</div></div>';
  const external = url => { try { const u=new URL(url); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } };
  const sourceLink = (url,label) => { const safe=external(url); return safe ? '<a href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>' : ''; };
  const artifactUrl = (e,path) => {
    if (typeof path!=='string' || !path || /[\\:?#\x00]/.test(path) || path.startsWith('/') || path.split('/').includes('..') || path.split('/').includes('private')) return '';
    return '../'+String(e.dir).split('/').map(encodeURIComponent).join('/')+'/'+path.split('/').map(encodeURIComponent).join('/');
  };
  const artifactLinks = (e,paths) => arr(paths).map(path => {
    const url=artifactUrl(e,path);
    return url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(path.split('/').pop())+'</a>' : '';
  }).join(' ');

  const cats={};
  entries.forEach(e=>{const c=e.category||'(未分类)'; cats[c]=(cats[c]||0)+1;});
  const catsSorted=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
  const reviewed=entries.filter(e=>e.verification_tier==='v2-reviewed').length;
  const legacy=entries.length-reviewed;
  document.getElementById('updated').textContent=(DATA.generated_at||'').replace('T',' ').slice(0,16);
  document.getElementById('stat').textContent=entries.length+' 条 · v2 复核记录 '+reviewed+' · 旧版自检 '+legacy;
  document.getElementById('stats').innerHTML=[['条目',entries.length],['v2 复核记录',reviewed],['旧版自检',legacy],['未入库',failed.length]]
    .map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd class="mono">'+v+'</dd></div>').join('');

  function swatches(tokens) {
    return Object.entries((tokens&&tokens.colors)||{}).map(([k,v])=>{
      const color=typeof v==='string' && /^(#[0-9a-f]{3,8}|(?:rgb|hsl|oklch|lab|color)\([^;{}]+\))$/i.test(v.trim());
      return color ? '<span class="sw" title="'+esc(k+': '+v)+'" style="background:'+esc(v)+'"></span>' : '<span class="tag">'+esc(v)+'</span>';
    }).join('');
  }
  function depsText(deps) {
    if (!arr(deps).length) return '<span class="tag tag--none">零依赖</span>';
    return deps.filter(d=>d!=null).map(d=>'<span class="tag tag--dep">'+esc(d.name||d)+(d.version?' '+esc(d.version):'')+'</span>').join(' ');
  }
  function plate(e,i) {
    const v2=e.verification_tier==='v2-reviewed';
    const highlights=arr(e.highlights), fragment=e.selected_fragment||{}, invariants=arr(fragment.invariants);
    const ver=e.verification||{}, review=ver.user_review||{}, evidence=arr(e.evidence), mc=arr(e.motion_catalog);
    const media=e.shot ? '<img src="'+esc(e.shot)+'" alt="'+esc(e.title+' 的 demo 实拍')+'" loading="lazy" onerror="this.remove()">' : '<span class="ph">未提供 demo 实拍</span>';
    const badge=v2 ? 'v2 复核记录通过' : '旧版自检 · 未按 v2 复核';
    const rows=[
      row('片段机制','<span class="meta__v--clamp">'+txt(e.extracted_mechanism)+'</span>'),
      row('设计判断',e.expression?'<span class="meta__v--clamp">'+txt(e.expression)+'</span>':NONE),
      row('适用边界',e.dont_copy?txt(e.dont_copy):NONE,'meta__row--flag')
    ];
    if (highlights.length) rows.push(row('亮点排序','<ol class="highlight-list">'+highlights.map(h=>'<li><strong>'+txt(h.name)+'</strong><br>'+txt(h.why_it_matters)+'</li>').join('')+'</ol>'));
    if (fragment.scope) rows.push(row('本次范围',txt(fragment.scope)));
    const more=[];
    if (fragment.rationale) more.push(row('选择理由',txt(fragment.rationale)));
    if (invariants.length) more.push(row('不变量','<ul class="invariant-list">'+invariants.map(inv=>'<li><span class="mono">'+esc(inv.id)+'</span> '+txt(inv.description)+'</li>').join('')+'</ul>'));
    if (arr(fragment.omitted).length) more.push(row('未实现',fragment.omitted.map(txt).join('；')));
    if (arr(fragment.asset_substitutions).length) more.push(row('素材替代',fragment.asset_substitutions.map(a=>txt(typeof a==='string'?a:JSON.stringify(a))).join('<br>')));
    if (e.composition) more.push(row('构图',txt(e.composition)));
    if (evidence.length) more.push(row('证据状态','<ol class="evidence-list">'+evidence.map(ev=>
      '<li><span class="tag">'+esc(status(ev.status))+'</span> <span class="mono">'+esc(ev.id)+'</span> '+txt(ev.claim)+
      '<br>'+txt([ev.action,ev.viewport].filter(Boolean).join(' · '))+
      '<br>'+(ev.publishable===true?artifactLinks(e,ev.artifacts):'<span class="small">证据文件未授权公开；完整记录见 SPEC</span>')+'</li>'
    ).join('')+'</ol>'));
    more.push(row('复核状态',v2?'v2 分项记录通过（结构校验不替代真实体验）':'历史自报可运行；尚未做本版独立设计对照'));
    if (v2) {
      more.push(row('独立复核','复核者 '+txt(review.reviewer)+'<br>'+arr(review.cases).map(c=>
        '<span class="tag">'+esc(status(c.result))+'</span> '+txt(c.invariant_id)+': '+txt(c.action)+' → '+txt(c.observation)+' ('+txt(c.viewport)+')<br>'+artifactLinks(e,c.artifacts)
      ).join('<br>')));
    }
    if (ver.note) more.push(row('验收说明',txt(ver.note)));
    if (mc.length) more.push(row('行为清单',mc.map(m=>'<span class="tag" title="'+esc([m.driver,m.trigger,m.duration,m.easing].filter(Boolean).join(' · '))+'">'+esc(m.name||'?')+(m.status?' · '+esc(status(m.status)):' · 旧版记录')+'</span>').join(' ')));
    else if (v2) more.push(row('行为清单','未记录动效；静态设计不必凑动画'));
    const sw=swatches(e.tokens);
    if (sw) more.push(row('配色','<span class="swatches">'+sw+'</span>'));
    const typography=(e.tokens&&e.tokens.typography)||{};
    if (Object.keys(typography).length) more.push(row('排版',txt(Object.entries(typography).map(([k,v])=>k+' '+v).join(' · '))));
    more.push(row('依赖',depsText(e.deps)));
    if (e.reuse_hints) more.push(row('适用',txt(e.reuse_hints)));
    if (e.repro_notes) more.push(row('复核条件',txt(e.repro_notes)));
    if ((e.source||{}).observed_at) more.push(row('访问版本',txt(e.source.observed_at+' · '+e.source.route)));
    if (arr(e.tags).length) more.push(row('原站标签',e.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join(' ')));

    const node=el('<article class="plate" style="--pi:'+i+'">'+
      '<div class="plate__media" data-src="'+esc(e.demo)+'"><span class="plate__idx">'+pad(i+1)+'</span>'+media+
      '<span class="plate__caption">demo 实拍</span><button class="plate__load" type="button">载入实时预览</button></div>'+
      '<div class="plate__head"><div class="plate__sub"><span class="label accent">'+esc(e.strength||e.category)+'</span><span class="label">'+esc(e.date)+'</span><span class="label">发现轴 '+esc(e.category)+'</span></div>'+
      '<h2 class="plate__title">'+esc(e.title||e.id)+'</h2><span class="review-badge review-badge--'+(v2?'v2':'legacy')+'">'+badge+'</span></div>'+
      '<dl class="meta">'+rows.join('')+'</dl><details class="plate__more"><summary>片段 · 证据 · 独立复核与参数</summary><dl class="meta">'+more.join('')+'</dl></details>'+
      '<div class="plate__foot"><span class="plate__id">'+esc(e.id)+'</span><span class="go"><a class="is-primary" href="'+esc(e.demo)+'" target="_blank" rel="noopener">打开 demo</a>'+
      sourceLink(e.source_url,'原站')+sourceLink(e.awwwards_url,'Awwwards')+(e.readme?'<a href="'+esc(e.readme)+'">README</a>':'')+(e.spec?'<a href="'+esc(e.spec)+'">SPEC</a>':'')+'</span></div></article>');
    node.querySelector('.plate__load').addEventListener('click',function(){
      const box=node.querySelector('.plate__media'), img=box.querySelector('img'), iframe=document.createElement('iframe');
      iframe.src=box.dataset.src; iframe.title=(e.title||e.id)+' demo 实时预览';
      box.insertBefore(iframe,this); if(img) img.remove();
      box.querySelector('.plate__caption').textContent='demo 实时预览'; this.remove();
    });
    node.dataset.hay=[e.id,e.title,e.author,e.category,e.summary,e.expression,e.extracted_mechanism,e.reuse_hints,
      JSON.stringify(highlights),JSON.stringify(fragment),arr(e.tags).join(' ')].join(' ').toLowerCase();
    node.dataset.cat=e.category||'(未分类)';
    return node;
  }
  const grid=document.getElementById('grid');
  const nodes=entries.map((e,i)=>{const n=plate(e,i);grid.appendChild(n);return n;});
  const chips=document.getElementById('chips'), active=new Set(), q=document.getElementById('q'), empty=document.getElementById('empty');
  catsSorted.forEach(c=>{
    const b=el('<button class="chip" type="button" aria-pressed="false">'+esc(c)+'<span class="chip__n">'+cats[c]+'</span></button>');
    b.onclick=()=>{if(active.has(c))active.delete(c);else active.add(c);b.setAttribute('aria-pressed',active.has(c));apply();};
    chips.appendChild(b);
  });
  function apply(){
    const term=q.value.trim().toLowerCase();let shown=0;
    nodes.forEach(n=>{const ok=(!active.size||active.has(n.dataset.cat))&&(!term||n.dataset.hay.includes(term));n.hidden=!ok;if(ok)shown++;});
    if(!entries.length){empty.hidden=false;empty.innerHTML='<p class="h3">暂无已入库条目</p><p class="small">先从模板创建草稿并直接打开 demo 复核；通过后再构建画廊。</p>';}
    else if(!shown){empty.hidden=false;empty.innerHTML='<p class="h3">没有匹配的条目</p><p class="small">换个关键词，或清掉分类筛选。</p>';}
    else empty.hidden=true;
  }
  q.addEventListener('input',apply); apply();
  if(failed.length){
    const box=document.getElementById('failed');box.hidden=false;
    box.innerHTML='<h2>未入库 '+failed.length+' 条</h2><p class="small">草稿可直接打开复核，不代表已经通过验收。</p><ul>'+failed.map(f=>
      '<li><span class="mono">'+esc(f.dir)+'</span> — '+esc(f.reason)+'<span class="failed-links">'+
      (f.demo?'<a href="'+esc(f.demo)+'" target="_blank" rel="noopener">检查草稿 demo</a>':'')+
      (f.spec?'<a href="'+esc(f.spec)+'">SPEC</a>':'')+(f.readme?'<a href="'+esc(f.readme)+'">README</a>':'')+'</span></li>'
    ).join('')+'</ul>';
  }
})();
</script>
</body>
</html>
