: "2026-10-11", "schema_version": 2, "verification_tier": "v2-reviewed", "category": "motion", "source": {"awwwards_url": "https://www.awwwards.com/sites/ownitt-2", "live_url": "https://ownitt.fr/", "title": "Ownitt", "author": "Ownitt", "award_date": "", "tags": ["design agencies", "web & interactive", "animation", "portfolio", "scrolling", "transitions", "storytelling", "gsap", "react", "next.js"], "observed_at": "2026-10-11 16:00 (CST, UTC+08:00)", "route": "https://ownitt.fr/ 首页根路由；首访（localStorage.ownitt_intro_seen 未设置）时首屏为浅色「品牌印章」封面，重复访问会跳过该封面直接进深色首屏；本轮所有观察均在首访封面状态下取样"}, "title": "Ownitt", "author": "Ownitt", "tags": ["design agencies", "web & interactive", "animation", "portfolio", "scrolling", "transitions", "storytelling", "gsap", "react", "next.js"], "dir": "entries/2026-10-11-scroll-cover-swap", "demo": "../entries/2026-10-11-scroll-cover-swap/demo/index.html", "readme": "../entries/2026-10-11-scroll-cover-swap/README.md", "spec": "../entries/2026-10-11-scroll-cover-swap/SPEC.json", "source_url": "https://ownitt.fr/", "awwwards_url": "https://www.awwwards.com/sites/ownitt-2", "shot": "../entries/2026-10-11-scroll-cover-swap/shots/demo.png", "shot_kind": "demo", "summary": "浅色品牌封面在滚动中被消费：主体标记绕固定中心放大到吞满视口，纵向标签列表是持续自走的循环带、滚动提示在前段淡出，最后一段滚动落下整屏幕布，滚满一屏后封面退出文档流、深色章节接管并把滚动基点拉回顶部。本次实现这个「封面 → 换幕」的最小完整体验片段，前幕与后幕两个状态都在。", "strength": "scene-choreography", "expression": "这个关系有效的理由不是「动效炫」，而是它把品牌自证浓缩成一次空间事件：首屏只有品牌记号、字标、一句定位与一串地名，用户在原地不动的情况下看见记号从一个小徽记长大到吞掉整屏——尺度变化本身承担了「Ownitt 无处不在」这句品牌主张的信息层级，而不是靠额外文案去说。第二层判断是节奏控制：滚动提示在封面早期就退场、幕布在尾段落下、滚满一屏即换幕，于是「还有多少」被这两个信号量化。需要把事实与判断分开：**标签列表并不承担这个量化**——它在零输入时也以约 12.9px/s 匀速自走，与滚动位置无关，是持续的环境带，不是进度指示。（初稿曾把它读作「滚动擦洗到末行夹紧」，第 1 轮独立复核在零输入下实测证伪，见 repro_notes 与 README 复核节。）需要区分事实与解释：实测到的是尺度、位置与透明度的连续映射（见 evidence）；「尺度变化=品牌主张」「节奏让用户预期换幕」是我的设计判断，不是转化率事实。", "composition": "前幕：整屏浅色纸（#F4F1EA），单一居中纵列，视觉重心压在纵列中段，四周留白均匀；自下而上依次为字标（先绘制，会被放大的标记覆盖）、品牌记号（相对定位并压在其上）、说明行（小字距大写 + 一行大号斜体强调）、固定高度标签窗。层叠由 DOM 顺序与定位层决定，实测命中顺序：字标最下 → 标记 → 说明行/标签窗 → 滚动提示 → 幕布（整屏最上）。标记是径向对称的单色记号，放大约 31 倍后其可见范围覆盖整屏上下缘，仍以自身中心为锚点，因此放大过程不会把构图重心甩出画面。后幕：整屏墨色（#0A0A0B），大号衬线标题 + 灰白正文，横向留白明显小于前幕，形成「纸 → 幕」的对比。断点：窄屏（390×844）下纵列宽度收窄、字号与记号的初始尺寸按比例缩小，堆叠顺序与「标记绕中心放大」的关系不变，实测无横向溢出。", "highlights": [{"id": "h1", "rank": 1, "name": "滚满一屏即被消费的封面（换幕）：记号放大吞屏 + 幕布落下 + 滚动基点回顶", "why_it_matters": "首屏的辨识度全部押在这一次空间事件上：不做就地淡出或位移，而是让品牌记号在缩放中吞掉画面、由落下的幕布收束，并把整块封面从文档流里撤走。移除这个关系（只留颜色和字号），首屏就退化成一个静态徽记页——用户第一眼读不到「这是一个把记号当主角的品牌」，这是该作品最不可替代的萃取点。", "dependencies": ["径向对称的单色品牌记号（可无级放大且不失去轮廓）", "固定中心锚点：放大时重心不漂移", "封面高度=一屏，使「换幕阈值」可被直觉量化", "浅色纸与深色幕的高对比，让落幕后不会出现亮度跳变", "滚动提示的早期退场，给放大过程让出注意力"], "evidence_ids": ["ev1", "ev2", "ev3", "ev4"]}, {"id": "h2", "rank": 2, "name": "钉住的文本舞台：逐词浮现后按 beat 交叉淡出的滚动擦洗", "why_it_matters": "中段的长文案不靠一次性入场，而是把句子拆成词、把段落拆成 beat，钉住一屏后用滚动量逐词点亮、再交叉淡出到下一段。它让「读一段宣言」变成有进度感的事件，而不是等待打字机结束。作为独立亮点，它证明了同一站里「滚动=时间轴」的一致做法；但它与前一个亮点共享驱动方式而非构图，因此排在 h1 之后。", "dependencies": ["一屏高的舞台 + 数倍于它的滚动占位（pin/lock 场景）", "可逐词寻址的文本结构", "每段文案长度接近，交叉淡出才不会露出空窗"], "evidence_ids": ["ev5"]}, {"id": "h3", "rank": 3, "name": "首屏图的滚动视差 + 固定标签下的纵向滚动关键词", "why_it_matters": "深色首屏用两个小动作维持「页在动」的感觉：背景图以约 0.194 倍速平移形成视差，固定标签旁的纵向关键词轨按行滚动，在有限宽度里塞进一长串业务词。它支撑语气与信息密度，但不改变页面结构，属于可迁移性中等、辨识度最低的辅效，故排第三。", "dependencies": ["可裁切的满幅背景图（视差需要溢出余量）", "固定宽度的标签槽，关键词才不至于推动版式", "关键词长度相近，逐行步进不会跳动"], "evidence_ids": ["ev6", "ev7"]}], "selected_fragment": {"highlight_id": "h1", "scope": "只做「封面 → 换幕」这一段：一屏浅色品牌封面（字标 / 径向记号 / 说明行 / 固定高度标签窗 / 滚动提示 / 整屏幕布），加上它下面的深色章节当作后幕。实现封面内的三条滚动映射（记号放大、提示淡出、幕布落下）与一条与滚动位置无关的自走循环带（纵向标签列表）与滚满一屏后的消费：封面退出文档流、滚动基点回到章节顶部。不做原站的长页面其余区块、不做钉住的文本舞台、不做首屏视差与关键词轨。", "rationale": "换幕这个关系是整站辨识度的入口，而且天然含「前幕/后幕」两个状态与「滚满一屏」的明确触发，正好构成一个最小完整体验片段；它依赖的素材全部可以原创（记号是几何图形、文案是自拟），不需要搬运原站的摄影、字体或代码；实现上用一个滚动进度映射 + 一次消费收束即可，符合小而完整的预算。", "invariants": [{"id": "inv1", "description": "封面是一屏浅色纸上的单一居中纵列：品牌记号、字标、说明行、纵向标签窗、滚动提示自上而下叠放（字标→记号→说明行→纵向标签窗→滚动提示），深色墨压在浅色纸上（纸/墨/幕的高对比是构图前提）。"}, {"id": "inv2", "description": "品牌记号在滚动中绕自身中心连续放大，从约 49px 长到吞满视口（近指数加速、约 31 倍），放大过程中其中心锚点不漂移。"}, {"id": "inv3", "description": "纵向标签列表在固定高度窗口内是一台持续自走的循环带：不做 ned with the lens are ticked in the legend."}], "omitted": ["The site's 480vh pinned scroll narrative (the dot-grid blueprint with eight captions and the build counter) — analysed as h2, not built here", "The X-ray toggle that re-maps the palette and overlays design-rationale annotations — analysed as h3, not built here", "The menu overlay, the five-letter hunt, the discovery counter and the sound control", "The dark theme toggle beyond a prefers-color-scheme block, and all of the site's own copy, imagery, fonts and stylesheets"], "asset_substitutions": [{"role": "The page under the lens (the magnified subject)", "substitute": "An original specimen sheet ('Halbton.', a fictional Leipzig print studio) built from my own markup: dot-grid substrate, measure micro-type, one display headline, a lede and three specimen rows. Preserves the design role of the original's surface: a single reading column, low-contrast paper, one large type mass, small peripheral annotations.", "basis": "original work, written for this entry"}, {"role": "The lens itself", "substitute": "A CSS circular window (border-radius 50%, overflow hidden) holding a clone of the sheet, with a box-shadow rim: inset 0 0 0 1px rgba(255,255,255,.35) and inset 0 0 22px rgba(18,18,20,.1).", "basis": "independent implementation of the observed mechanism; the original draws its rim partly on a difference-blend canvas, which is not reproduced"}, {"role": "The handwritten ink layer", "substitute": "Three original English notes in a handwritten OFL face (Kalam), red, slightly rotated, pinned over the specimens.", "basis": "original copy; the original's notes are its own brand voice and were not transcribed"}, {"role": "Display face (Bricolage Grotesque)", "substitute": "Archivo variable, bundled (SIL OFL 1.1)", "basis": "OFL bundle, licence text in src/fonts/FONTS.md; weight/width/tracking compared against the measured 103.68px/500/-0.035em rather than assumed equal"}, {"role": "Text face (Space Grotesk)", "substitute": "Inter variable, bundled (SIL OFL 1.1)", "basis": "OFL bundle; Inter's larger x-height and more neutral skeleton is a documented loss"}, {"role": "Measure labels (IBM Plex Mono)", "substitute": "system monospace stack", "basis": "no bundle needed for 10–11px uppercase micro-type; loss is in the terminals, not the fit"}]}, "evidence": [{"id": "ev1", "claim": "Dragging the docked lens lifts it and it follows the pointer; the sheet copy under it is scaled 1.6x about the pointer, verified by transform arithmetic (translate = radius - 1.6*(pointer - sheetOrigin)) rather than by eye.", "status": "observed", "method": "CDP Input.dispatchMouseEvent mousePressed on the dock centre then mouseMoved through four steps while reading .loupe-hit / .loupe-glass rects and .loupe-page inline transform.", "route": "https://metic.studio/en", "target": ".loupe-hit / .loupe-glass / .loupe-page", "action": "press-and-hold the dock handle, drag across the page, read geometry at each step", "viewport": "1440x900", "artifacts": ["shots/private/orig-loupe-drag-1440.png"], "publishable": false}, {"id": "ev2", "claim": "The hidden ink layer is revealed only inside the lens circle: each .secret-ink carries a radial-gradient mask whose radius and centre are written from the lens, measuring --sr 95.8px against a 121px lens radius, and the rest of the page shows visibility hidden with --sr 0.", "status": "observed", "method": "Held the lens over the display headline and read getComputedStyle(...).getPropertyValue('--sr'/'--sx'/'--sy') and visibility on every .secret-ink while held and after release.", "route": "https://metic.studio/en", "target": ".secret-ink (mask-image radial-gradient driven by --sr/--sx/--sy)", "action": "hold the lens over the headline, sample the ink masks, release and sample again", "viewport": "1440x900", "artifacts": ["shots/private/orig-loupe-heading-1440.png", "shots/private/orig-loupe-held-1440.png"], "publishable": false}, {"id": "ev3", "claim": "Release drops the lens: .loupe-view opacity falls from 1 to 0, html loses the loupe-held class and the ink masks are cleared, so the sheet returns to a plain printed page.", "status": "observed", "method": "mouseReleased at the held position, then read .loupe-view opacity, html class list and .secret-ink visibility; also captured the at-rest hero for comparison.", "route": "https://metic.studio/en", "target": ".loupe-view / html.loupe-held / .secret-ink", "action": "release the pointer after a hold and observe the return to rest", "viewport": "1440x900", "artifacts": ["shots/private/orig-hero-1440.png"], "publishable": false}, {"id": "ev4", "claim": "The build section is a 480vh pinned stage: scrolling maps linearly to a --dots progress on the substrate (0 to 1) and to a 000-100% counter, while eight captions cross-fade in order (opacity 1 for the active step, 0 with translate-y-3 and blur(2px) for the others).", "status": "observed", "method": "Page.bringToFront to unfreeze the timeline (document.timeline.currentTime was 0 and requestAnimationFrame did not fire while the tab was hidden), then window.scrollTo across the section reading --dots, the counter text and every caption's opacity.", "route": "https://metic.studio/en", "target": "section.build > .build-stage (sticky, height 480vh)", "action": "scroll the section in 540px steps from 000% to 100% and read the progress variable, counter and caption opacities", "viewport": "1440x900", "artifacts": ["shots/private/orig-build-start-1440.png", "shots/private/orig-build-mid-1440.png", "shots/private/orig-build-end-1440.png"], "publishable": false}, {"id": "ev5", "claim": "The X-ray button re-maps the palette through role variables and reveals per-element rationale annotations: aria-pressed flips to true, --paper resolves to #0b0c10, --ink to #eeeeea, an overlay canvas at z-index 79 goes to opacity 1 and the data-note annotations become visible for elements in view.", "status": "observed", "method": "clicked the nav button titled 'X-ray en #entdeckungen panel, and enumerated .secret-ink and [data-note] elements in the live DOM. This is the site's own description of the interaction, not a substitute for the observed runs above.", "route": "https://metic.studio/en", "target": ".lens-hint, #entdeckungen, .secret-ink, [data-note]", "action": "read the in-page copy and enumerate the hidden-ink nodes (no gesture performed for this claim)", "viewport": "1440x900", "artifacts": [], "publishable": false}], "motion_catalog": [{"name": "Lens lift, follow and drop", "target": ".hb-glass (fixed circular window) and the sheet clone inside it", "trigger": "pointerdown on the dock handle (immediate) or press-and-hold anywhere on the sheet (after 130ms of stillness); pointerup / pointercancel releases", "driver": "Pointer events; the glass is positioned with translate3d and the clone with translate3d + scale, both written directly on the elements. No rAF loop, so nothing runs when the tab is hidden.", "duration": null, "easing": null, "delay": null, "states": [{"name": "before", "description": "Lens parked on the dock, glass opacity 0, no clone; every note reports visibility hidden and --hb-r cleared."}, {"name": "mid", "description": "Held: glass opacity 1 with its centre on the pointer; the clone carries translate3d(-(zoom-1)*pointer) scale(1.6) about the sheet origin; the note under the lens has --hb-r = 0.8 x lens radius and is visible, the others are masked away."}, {"name": "after", "description": "Released: is-lifting removed, glass parks back on the dock centre and fades to 0, note mask variables are cleared, found notes keep their legend tick."}], "status": "observed", "evidence_ids": ["ev1", "ev2", "ev3"]}, {"name": "Build blueprint scroll mapping", "target": "section.build > .build-stage (sticky, 480vh)", "trigger": "scroll through the section", "driver": "Scroll position mapped to a --dots progress value on the sticky stage (0 to 1), to the eight caption cross-fades and to a numeric build counter. No fixed easing: the mapping is linear in scroll distance.", "duration": null, "easing": null, "delay": null, "states": [{"name": "before", "description": "--dots 0, counter 000%, caption 01 'A line.' at opacity 1, the other seven at 0."}, {"name": "mid", "description": "--dots 1, counter ~063%, caption 05 at opacity 1 while its neighbours sit at 0 with translate-y-3 and blur(2px)."}, {"name": "after", "description": "--dots 1, counter 100%, caption 08 'Your turn.' at opacity 1."}], "status": "observed", "evidence_ids": ["ev4"]}, {"name": "X-ray palette re-map", "target": "html (role colour variables) plus per-element annotation notes", "trigger": "clicking the nav X-ray button", "driver": "Class toggle on the root element; CSS custom properties re-resolve (paper #f4f4f2 to #0b0c10, ink #121214 to #eeeeea, line to #1212146b) and annotation labels become visible. Toggling again restores the light palette.", "duration": null, "easing": null, "delay": null, "states": [{"name": "before", "description": "aria-pressed false; paper #f4f4f2 / ink #121214; annotation notes display none."}, {"name": "after", "description": "aria-pressed true; paper #0b0c10 / ink #eeeeea; an overlay canvas at z-index 79 goes from opacity 0 to 1 and the rationale notes for on-screen elements become visible (5 in view at 1440x900)."}], "status": "observed", "evidence_ids": ["ev5"]}], "extracted_mechanism": "A surface with two layers — a calm, legible printed page and a second, genuinely hidden ink layer. A lens is parked at a dock and is lifted by a hold gesture; while it is held it is a fixed circular window (border-radius 50%, overflow hidden) containing a copy of the surface, transformed about its own top-left origin by translate(r - k*(pointer - surfaceOrigin)) scale(k) with k = 1.6, which is exactly the transform that magnifies the surface about the pointer. Because the window is circular and the copy carries the second layer forced visible, the hidden ink appears only inside the circle; the underlying sheet is additionally masked with radial-gradient(circle r*0.8 at lensCentre) so the same reveal holds on the real layer. Releasing parks the window back on the dock and clears the mask variables. There is no autonomous animation: everything is pointer-driven, so nothing needs pausing when the tab is hidden.", "dont_copy": "The lens is a strong move but a costly one to use twice: a page that hides content behind a gesture needs the non-lens path to be genuinely present (this fragment uses reveal-all, no-JS and reduced-motion fallbacks), otherwise the notes are unreachable for keyboard, touch or reduced-motion users. Two further boundaries from the source: the held lens did not move in my synthetic touch runs, so the touch variant of the affordance is unverified here and should not be copied as a guarantee; and the original draws part of the lens rim on a difference-blend canvas, which is an implementation choice, not a design requirement — a box-shadow rim reads the same. Nothing here suggests the original failed at contrast or accessibility; those were not measured.", "tokens": {"colors": {"paper": "#f4f4f2", "paper_2": "#e9e9e6", "ink": "#121214", "ink_2": "#4a4a50", "line": "rgba(18,18,20,0.12)", "accent_red": "#d8332a", "accent_deep": "#a8241d", "dark_paper": "#0f0f11", "xray_bg": "#0b0c10", "xray_fg": "#eeeeea", "xray_line": "#1212146b", "glass_rim": "inset 0 0 0 1px rgba(255,255,255,0.35)", "glass_inner_shade": "inset 0 0 22px rgba(18,18,20,0.1)"}, "typography": {"display_source": "Bricolage Grotesque", "display_substitute": "Archivo (bundled, SIL OFL 1.1)", "h1_measured": {"font-size": "103.68px", "font-weight": 500, "line-height": 0.96, "letter-spacing": "-0.035em"}, "text_source": "Space Grotesk", "text_substitute": "Inter (bundled, SIL OFL 1.1)", "hand_source": "Caveat", "hand_substitute": "Kalam (bundled, SIL OFL 1.1)", "mono_source": "IBM Plex Mono", "mono_substitute": "system ui-monospace stack (not bundled)", "fragment_h1": "clamp(2.5rem, 7.2vw, 7rem), weight 500, line-height 0.96, letter-spacing -0.035em", "note_face": "Kalam 700, rotated by a per-note --hb-tilt"}, "spacing": {"shell": "clamp(1.25rem, 5vw, 5rem)", "nav_h": "4.5rem", "dot_grid_pitch": "16px", "lens_radius_desktop": "121px measured at 1440x900", "lens_radius_narrow": "89px measured at 390x844", "lens_diameter_measured": "242px 可见玻璃（按住态亮度剖面：内容到 r≈120、圈环 122~134、140 外回纸色；r≈121 与 242px 相容）；原站镜片 canvas 元素本身为 324×324（r=162），两次测量口径不同", "fragment_lens_radius": "clamp(88px, 8.4vw, 128px)", "specimen_columns": "2.5rem minmax(6rem,14rem) 1fr minmax(6rem,10rem)"}, "motion": {"ease_lens": "cubic-bezier(0.23, 1, 0.32, 1)", "lens_fade_ms": 400, "fragment_lens_park_ms": 420, "zoom": 1.6, "ink_radius_ratio": 0.79, "fragment_ink_radius_ratio": 0.8, "caption_crossfade_ms": 700, "build_scroll_length": "480vh"}}, "api": "window.HalbtonLens.create(rootEl, options) initialises a lens inside [data-lens-root] and returns an instance; it is also auto-initialised on every [data-lens-root] at DOMContentLoaded. Required markup inside the root: [data-lens-sheet] (the surface to magnify, and the containing block for the notes), [data-lens-glass] containing [data-lens-track], [data-lens-dock], optional [data-lens-count], [data-lens-all] and [data-note-id] elements with matching [data-dot]. Options: { zoom, reveal, holdDelay }. Instance API: revealAll(on) toggles the non-lens path and returns the new state; drop() parks the lens; destroy() removes every listener and the clone. Tune --hb-lens-r, --hb-zoom, --hb-reveal, --hb-drop and --hb-ease on the root.", "entrypoints": ["src/lens.css", "src/lens.js"], "files": ["demo/index.html", "src/lens.css", "src/lens.js", "src/fonts/FONTS.md", "src/fonts/archivo-0.woff2", "src/fonts/inter-0.woff2", "src/fonts/kalam-0.woff2", "src/fonts/kalam-1.woff2"], "deps": [], "reuse_hints": "Use it where a surface has a second layer worth earning: spec sheets, annotated drawings, code samples with commentary, product photography with hotspots, maps with notes. Requirements: the base surface must be readable on its own, the hidden layer must be genuinely additive (not the only copy of important text), and the page must be willing to give up 130ms of press before the lens lifts. The clone approach assumes the magnified surface is self-contained — it will not carry fixed or portalled content (overlays, tooltips, canvases drawn in screen space) into the lens, so keep such elements outside [data-lens-sheet]. Not suitable when the page is already scroll-jacked or when the second layer is longer than the lens can show: a lens reveals fragments, so the notes must work as fragments.", "repro_notes": "Open demo/index.html directly from disk (file:// works; the bundled woff2 faces load without errors). At rest the lens sits on the dock at the top-right with glass opacity 0. Drag the dock (pointerdown then move) or press and hold anywhere on the sheet for 130ms; the lens follows the pointer, the sheet under it is magnified 1.6x and the note inside the circle appears. Move over a specimen note to tick it in the legend; release to park. On narrow viewports the fragment is still one screen at 390x844 with no horizontal overflow; the lens radius measures 89px there. Measurements above were taken live with CDP in Chromium at 1440x900 and 390x844 on 2026-10-11; the source tab had to be brought to the front with Page.bringToFront because requestAnimationFrame and document.timeline were frozen while the tab was hidden (the build section stayed at 000% until it was). Not verified: real touch hardware, the source's touch variant of the hold gesture (synthetic touch set the held state but did not move the lens), click-through of the lens on top of interactive elements at very small viewports, and any accessibility tree or contrast measurement of the original. Code budget: ~650 hand-written core lines (src/lens.css 416（复核后清理时加入因果注释块，原记 409）— the four @font-face blocks, the full token block and the no-JS / reduced-motion / dark-scheme fallbacks; src/lens.js 241 including comments). That is slightly over the 400–600 guide; the extra lines are degradation paths and inline documentation rather than hidden complexity. 选择器存疑（复核 #2 指出）：镜片的元素/类名记录（.loupe-hit / .loupe-glass / .loupe-page / .loupe-view）取自当时观察的近似描述；2026-10-13 复核在线上构建中对这些选择器 0 命中，实际镜片是 324×324 CSS px 的 <canvas class=\"pointer-events-none fixed left-0 top-0 z-[105] max-w-none will-change-transform\">，状态类 has-loupe / lens-held / loupe-held / loupe-live 确实存在（loupe-held 命中）。行为结论不受影响：--sr/--sx/--sy 与遮罩实测与记录一致。元素名应视为未定论项。", "variant_of": null, "verification": {"rendered_ok": true, "console_errors": 0, "screenshot": "shots/demo.png", "checked_at": "2026-10-13T13:55:00+08:00", "source_observed": true, "mechanism_preserved": true, "user_review": {"passed": true, "reviewer": "loupe-review-r2 · 独立子代理（Hermes 浏览器会话 Chromium + CDP；未参与本条目实现，也未参与第 1 轮复核与本次修订，未读旧实现）", "cases": [{"invariant_id": "inv1", "action": "file:// 直开 demo（1440×900，未经画廊）。静止读镜片/纸面 rect 与每条批注 visibility → 在镜位按下并拖过 (1100,300)(900,420)(760,470)(430,300) → 释放后 100ms/800ms 各读一次 → 另做三次对照：纸面空白处按住 400ms、纸面空白处 50ms 内单击、纸面空白处按下后 50ms 内拖动。", "observation": "静止：镜心恰为镜位 (1309,116)、opacity 0、DOM 里没有克隆、三条批注 visibility:hidden。按住后 root.is-lifting＋html.hb-held，镜心与指针逐点重合，opacity→1；释放后 100ms 内退类、镜片回镜位、opacity 1→0.32→0，批注重新 hidden 且 --hb-r/--hb-x/--hb-y 被清空。空白处按住 400ms 抬起（镜心=指针）；50ms 内的单击与拖动都不抬起（不被当成按住，滚动安全）。控制台 0 错误。窄屏 390×844 重复按住—释放，同样成立（镜半径 88px，镜心=指针 (178,464)）。", "viewport": "1440×900（并复测 390×844）", "result": "pass", "artifacts": ["shots/demo-r2-inv1-rest-1440.png", "shots/demo-r2-inv1-held-1440.png", "shots/demo-r2-inv1-released-1440.png", "shots/demo-r2-narrow-rest-390.png", "shots/demo-r2-narrow-held-390.png"]}, {"invariant_id": "inv2", "action": "把镜片停在纸面标题处并缓慢平移：分别在 (712,300)、(760,340)、(900,500)、(940,500) 四个指针位置，读镜心屏幕坐标、纸面与 .hb-clone 中同名元素（标题、引言、样张小字/粗体/数值、顶栏小字）的中心，按 cloneC = 镜心 + 1.6×(纸面C − 镜心) 算预测偏差；再把镜片正对 m1/m2/m3 三条批注各自的真实中心，读克隆内该批注中心到镜心的距离；最后做像素级复核：同一视口先截静止帧，再截镜下帧，对穿镜心的 12 条扫描线用静止帧纸面剖面按候选 k（1.0–1.9，步长 0.05）重采样，与镜下剖面求平均绝对差，取最小者。", "observation": "DOM：4 个指针位置 × 6 个元素，预测与实测最大偏差 0.51px（多数 ≤0.1px），即镜心底下正是该点纸面放大 1.6 倍后的内容；镜片正对 m1/m2/m3 中心时，克隆内对应批注中心距镜心 1.8px / 0.8px / 1.4px（指针取整带来的亚像素差）。纸面侧遮罩中心同步落在该批注自身中心（m2 的 --hb-x/--hb-y = 149.7px/25.1px ≈ 盒宽高的一半）。像素：12 条扫描线的剖面拟合在 k=1.6 时平均绝对差最小（k=1.6 → 10.7~16.5；k=1.5/1.65 → 13.6~19.4；k=1.1 → 53~60），放大倍数与锚点由像素独立确认。快速跳滚到页底再回顶后重测，同一批注仍在镜心 (998,878) 0.8px 内。", "viewport": "1440×900", "result": "pass", "artifacts": ["shots/demo-r2-lens-rest-1440.png", "shots/demo-r2-lens-held-712-1440.png", "shots/demo-r2-lens-held-760-1440.png", "shots/demo-r2-scrolljump-held-1440.png"]}, {"invariant_id": "inv3", "action": "把镜片正对三条批注各自的真实中心（m1 (606,711)、m2 (998,878)、m3 (785,732)，m3 先滚到可见高度）逐条截图；再用 PIL 统计镜圈（半径 120.95px）内近 #d8332a（容差 ±40，另报 ±12）的像素数。随后把镜片移到远离所有批注处 (250,150) 与拖动途中 (430,300) 重复统计，并在同一坐标的静止帧上统计作为对照。再做移除检验：仅在浏览器里注入 .hb-clone{box-sizing:content-box !important}（不改任何源码文件），在同一位置复测镜像与红墨；随后移除该注入并复测复原。窄屏 390×844 用镜半径 88px 复测一次。", "observation": "镜圈内近 #d8332a 像素：正对 m1 = 1980、m2 = 1805、m3 = 1384（±12 收缩阈值 1487/1362/1122）；同一坐标静止帧 = 0；远离所有批注 = 0；拖动途中 = 0；镜圈外环带（+8px）仅 2~6 像素，是圆形裁剪边缘的抗锯齿。窄屏 390×844：正对 m2 镜圈内 1776，静止帧同区域 0。移除检验：克隆改成 content-box 后克隆盒由 2280×1785.6 变成 2510.4×2131.2，克隆内 m2 中心距镜心由 0.8px 变成 396.5px，镜圈内红墨由 1805 变成 0；去掉注入样式后三项全部复原 —— box-sizing:border-box 正是这条不变量成立的关键，红墨只在镜圈内出现。", "viewport": "1440×900（并复测 390×844）", "result": "pass", "artifacts": ["shots/demo-r2-inv3-note-m1-1440.png", "shots/demo-r2-inv3-note-m2-1440.png", "shots/demo-r2-inv3-note-m3-1440.png", "shots/demo-r2-inv3-away-1440.png", "shots/demo-r2-removaltest-before-1440.png", "shots/demo-r2-removaltest-boxsizing-1440.png", "shots/demo-r2-narrow-held-390.png"]}, {"invariant_id": "inv4", "action": "读 .hb-glass 与 .hb-rim 的计算样式（border-radius、overflow、background、box-shadow、尺寸）；按住镜柄把镜片扫过纸面角与边：(20,860)(1425,880)(720,880)(20,20)(1400,20)(720,60)(400,600)(1050,300)，每一步同时读纸面 rect、documentElement 的 scrollWidth/scrollHeight、标题框与第 2 行样张的 rect；随后快速跳滚到页底再回到顶部，重测同一批读数。", "observation": "镜片：border-radius 50%、overflow hidden、background rgb(244,244,242)＝纸色（不透明，读作一片地面而不是透明放大镜）、box-shadow inset 0 0 0 1px rgba(255,255,255,.35) + inset 0 0 22px rgba(18,18,20,.1)，镜径 241.91px。八个扫描点的纸面 rect 恒为 [0,0,1425,1116]，scrollWidth 恒 1425、scrollHeight 恒 2283，标题框恒 [72,267,1281,99.53]、第 2 行样张恒 [72,830.4,1281,121.8]；移动镜片既不推动也不回流纸面。跳滚到页底（scrollY 1383）再回顶后，纸面读数与镜片行为不变，控制台 0 错误。", "viewport": "1440×900", "result": "pass", "artifacts": ["shots/demo-r2-inv4-sweep-1440.png", "shots/demo-r2-scrolljump-bottom-1440.png", "shots/demo-r2-scrolljump-held-1440.png"]}, {"invariant_id": "inv5", "action": "① 用 CDP 关闭 JS 重载，截图后用 PIL 在三条批注的静止位置与镜位区数红墨；② 正常重载后用 Tab 走焦点顺序、在「Reveal all notes」上按空格触发，读 aria-pressed、root 类名、三条批注的 visibility 与 mask，再在 reveal-all 打开的状态下把镜片停在 m2 上、释放后读图例；③ 用 CDP 模拟 prefers-reduced-motion:reduce，读过渡时长并重做一次按住；④ 读图例计数与圆点的 is-found 是否保留。", "observation": "① 无 JS：html 保留 no-js，m1/m2 批注静止位置分别 1467/1415 个红墨像素（全屏 2887）、镜柄不渲染（镜位区 0 红像素）——批注无需镜片即可读；② 键盘：焦点顺序为 wordmark 链接 → 「Reveal all notes」→ 镜柄，空格触发后 aria-pressed=true、root.is-revealed、三条批注 visibility:visible 且 mask-image:none；reveal-all 打开时再按住镜片，m2 被读到并在图例打勾（1 / 3）；③ reduced-motion：.hb-glass/.hb-dock 的 transition-duration 为 0s，按住仍抬起（opacity 1）且镜下红墨照常出现（镜圈内 2036 像素）；④ 释放后图例保留已读计数、圆点保留 is-found，未读的仍为空。", "viewport": "1440×900", "result": "pass", "artifacts": ["shots/demo-r2-inv5-nojs-1440.png", "shots/demo-r2-inv5-revealall-1440.png", "shots/demo-r2-inv5-revealall-held-1440.png", "shots/demo-r2-inv5-reducedmotion-held-1440.png"]}], "note": "第 2 轮独立复核（2026-10-13，1440×900 与 390×844，file:// 直开未入库 demo）：5 条不变量全部实测 pass，控制台 0 错误（含资源加载错误监听），故填 reviewer 并置 rendered_ok=true。关键实测：镜心底下就是该点纸面绕指针放大 1.6 倍的内容（DOM 预测偏差 ≤0.51px，像素剖面拟合 k=1.6 最优）；红墨只在镜圈内出现（正对 m1/m2/m3 时镜圈内 1980/1805/1384 像素，其余状态 0）；移动镜片时纸面 rect/scrollWidth 恒定；无 JS、键盘 reveal-all、reduced-motion 三条替代路径都能读到全部批注。同视口（1440×900）、同片段（抬起镜片态）的原站对照：原站按住不动时 html 得到 loupe-held/loupe-live、.secret-ink 变为 visible 且 --sr=95.8px，镜圈内新增约 1267 个红色像素（#ff3e3e），静止帧同区域 501 个——原站与 demo 都在镜下浮出纸面上不存在的红墨；本 demo 同状态为 +1875 个 #d8332a 像素。第 1 轮的 box-sizing 缺陷确已修复且在浏览器内可复现其移除效应（见 inv3 case）。"}, "note": "第 2 轮独立复核通过（2026-10-13，复核者 loupe-review-r2，未参与实现与修订）：5 条不变量逐条实测 pass，console_errors=0，故 rendered_ok=true。第 1 轮（inv2/inv3 fail）的记录保留在 README「独立操作复核与未验证项」中并标为作废，仅作修订过程凭证。仍在 README 未验证项中如实列出的缺口（真实触摸硬件、原站触摸分支、极小视口点击穿透、原站对比度/无障碍树）不影响本片段 5 条不变量的判定。"}}], "failed": []}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const entries = DATA.entries || [], failed = DATA.failed || [];
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const txt = s => esc(String(s == null ? '' : s).replace(/\*\*/g,''));
  const el = html => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
  const arr = v => Array.isArray(v) ? v : [];
  const pad = n => String(n).padStart(2,'0');
  const NONE = '<span class="meta__v--none">未记录</span>';
  const status = s => ({observed:'实际观察', 'source-supported':'源码支持', inferred:'推断', unknown:'未验证', pass:'通过', fail:'失败', unverified:'未验证'}[s] || '未记录');
  const row = (k,v,cls) => '<div class="meta__row'+(cls?' '+cls:'')+'"><span class="meta__k">'+esc(k)+'</span><div class="meta__v">'+v+'</div></div>';
  const external = url => { try { const u=new URL(url); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } };
  const sourceLink = (url,label) => { const safe=external(url); return safe ? '<a href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>' : ''; };
  const artifactUrl = (e,path) => {
    if (typeof path!=='string' || !path || /[\\:?#\x00]/.test(path) || path.startsWith('/') || path.split('/').includes('..') || path.split('/').includes('private')) return '';
    return '../'+String(e.dir).split('/').map(encodeURIComponent).join('/')+'/'+path.split('/').map(encodeURIComponent).join('/');
  };
  const artifactLinks = (e,paths) => arr(paths).map(path => {
    const url=artifactUrl(e,path);
    return url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(path.split('/').pop())+'</a>' : '';
  }).join(' ');

  const cats={};
  entries.forEach(e=>{const c=e.category||'(未分类)'; cats[c]=(cats[c]||0)+1;});
  const catsSorted=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
  const reviewed=entries.filter(e=>e.verification_tier==='v2-reviewed').length;
  const legacy=entries.length-reviewed;
  document.getElementById('updated').textContent=(DATA.generated_at||'').replace('T',' ').slice(0,16);
  document.getElementById('stat').textContent=entries.length+' 条 · v2 复核记录 '+reviewed+' · 旧版自检 '+legacy;
  document.getElementById('stats').innerHTML=[['条目',entries.length],['v2 复核记录',reviewed],['旧版自检',legacy],['未入库',failed.length]]
    .map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd class="mono">'+v+'</dd></div>').join('');

  function swatches(tokens) {
    return Object.entries((tokens&&tokens.colors)||{}).map(([k,v])=>{
      const color=typeof v==='string' && /^(#[0-9a-f]{3,8}|(?:rgb|hsl|oklch|lab|color)\([^;{}]+\))$/i.test(v.trim());
      return color ? '<span class="sw" title="'+esc(k+': '+v)+'" style="background:'+esc(v)+'"></span>' : '<span class="tag">'+esc(v)+'</span>';
    }).join('');
  }
  function depsText(deps) {
    if (!arr(deps).length) return '<span class="tag tag--none">零依赖</span>';
    return deps.filter(d=>d!=null).map(d=>'<span class="tag tag--dep">'+esc(d.name||d)+(d.version?' '+esc(d.version):'')+'</span>').join(' ');
  }
  function plate(e,i) {
    const v2=e.verification_tier==='v2-reviewed';
    const highlights=arr(e.highlights), fragment=e.selected_fragment||{}, invariants=arr(fragment.invariants);
    const ver=e.verification||{}, review=ver.user_review||{}, evidence=arr(e.evidence), mc=arr(e.motion_catalog);
    const media=e.shot ? '<img src="'+esc(e.shot)+'" alt="'+esc(e.title+' 的 demo 实拍')+'" loading="lazy" onerror="this.remove()">' : '<span class="ph">未提供 demo 实拍</span>';
    const badge=v2 ? 'v2 复核记录通过' : '旧版自检 · 未按 v2 复核';
    const rows=[
      row('片段机制','<span class="meta__v--clamp">'+txt(e.extracted_mechanism)+'</span>'),
      row('设计判断',e.expression?'<span class="meta__v--clamp">'+txt(e.expression)+'</span>':NONE),
      row('适用边界',e.dont_copy?txt(e.dont_copy):NONE,'meta__row--flag')
    ];
    if (highlights.length) rows.push(row('亮点排序','<ol class="highlight-list">'+highlights.map(h=>'<li><strong>'+txt(h.name)+'</strong><br>'+txt(h.why_it_matters)+'</li>').join('')+'</ol>'));
    if (fragment.scope) rows.push(row('本次范围',txt(fragment.scope)));
    const more=[];
    if (fragment.rationale) more.push(row('选择理由',txt(fragment.rationale)));
    if (invariants.length) more.push(row('不变量','<ul class="invariant-list">'+invariants.map(inv=>'<li><span class="mono">'+esc(inv.id)+'</span> '+txt(inv.description)+'</li>').join('')+'</ul>'));
    if (arr(fragment.omitted).length) more.push(row('未实现',fragment.omitted.map(txt).join('；')));
    if (arr(fragment.asset_substitutions).length) more.push(row('素材替代',fragment.asset_substitutions.map(a=>txt(typeof a==='string'?a:JSON.stringify(a))).join('<br>')));
    if (e.composition) more.push(row('构图',txt(e.composition)));
    if (evidence.length) more.push(row('证据状态','<ol class="evidence-list">'+evidence.map(ev=>
      '<li><span class="tag">'+esc(status(ev.status))+'</span> <span class="mono">'+esc(ev.id)+'</span> '+txt(ev.claim)+
      '<br>'+txt([ev.action,ev.viewport].filter(Boolean).join(' · '))+
      '<br>'+(ev.publishable===true?artifactLinks(e,ev.artifacts):'<span class="small">证据文件未授权公开；完整记录见 SPEC</span>')+'</li>'
    ).join('')+'</ol>'));
    more.push(row('复核状态',v2?'v2 分项记录通过（结构校验不替代真实体验）':'历史自报可运行；尚未做本版独立设计对照'));
    if (v2) {
      more.push(row('独立复核','复核者 '+txt(review.reviewer)+'<br>'+arr(review.cases).map(c=>
        '<span class="tag">'+esc(status(c.result))+'</span> '+txt(c.invariant_id)+': '+txt(c.action)+' → '+txt(c.observation)+' ('+txt(c.viewport)+')<br>'+artifactLinks(e,c.artifacts)
      ).join('<br>')));
    }
    if (ver.note) more.push(row('验收说明',txt(ver.note)));
    if (mc.length) more.push(row('行为清单',mc.map(m=>'<span class="tag" title="'+esc([m.driver,m.trigger,m.duration,m.easing].filter(Boolean).join(' · '))+'">'+esc(m.name||'?')+(m.status?' · '+esc(status(m.status)):' · 旧版记录')+'</span>').join(' ')));
    else if (v2) more.push(row('行为清单','未记录动效；静态设计不必凑动画'));
    const sw=swatches(e.tokens);
    if (sw) more.push(row('配色','<span class="swatches">'+sw+'</span>'));
    const typography=(e.tokens&&e.tokens.typography)||{};
    if (Object.keys(typography).length) more.push(row('排版',txt(Object.entries(typography).map(([k,v])=>k+' '+v).join(' · '))));
    more.push(row('依赖',depsText(e.deps)));
    if (e.reuse_hints) more.push(row('适用',txt(e.reuse_hints)));
    if (e.repro_notes) more.push(row('复核条件',txt(e.repro_notes)));
    if ((e.source||{}).observed_at) more.push(row('访问版本',txt(e.source.observed_at+' · '+e.source.route)));
    if (arr(e.tags).length) more.push(row('原站标签',e.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join(' ')));

    const node=el('<article class="plate" style="--pi:'+i+'">'+
      '<div class="plate__media" data-src="'+esc(e.demo)+'"><span class="plate__idx">'+pad(i+1)+'</span>'+media+
      '<span class="plate__caption">demo 实拍</span><button class="plate__load" type="button">载入实时预览</button></div>'+
      '<div class="plate__head"><div class="plate__sub"><span class="label accent">'+esc(e.strength||e.category)+'</span><span class="label">'+esc(e.date)+'</span><span class="label">发现轴 '+esc(e.category)+'</span></div>'+
      '<h2 class="plate__title">'+esc(e.title||e.id)+'</h2><span class="review-badge review-badge--'+(v2?'v2':'legacy')+'">'+badge+'</span></div>'+
      '<dl class="meta">'+rows.join('')+'</dl><details class="plate__more"><summary>片段 · 证据 · 独立复核与参数</summary><dl class="meta">'+more.join('')+'</dl></details>'+
      '<div class="plate__foot"><span class="plate__id">'+esc(e.id)+'</span><span class="go"><a class="is-primary" href="'+esc(e.demo)+'" target="_blank" rel="noopener">打开 demo</a>'+
      sourceLink(e.source_url,'原站')+sourceLink(e.awwwards_url,'Awwwards')+(e.readme?'<a href="'+esc(e.readme)+'">README</a>':'')+(e.spec?'<a href="'+esc(e.spec)+'">SPEC</a>':'')+'</span></div></article>');
    node.querySelector('.plate__load').addEventListener('click',function(){
      const box=node.querySelector('.plate__media'), img=box.querySelector('img'), iframe=document.createElement('iframe');
      iframe.src=box.dataset.src; iframe.title=(e.title||e.id)+' demo 实时预览';
      box.insertBefore(iframe,this); if(img) img.remove();
      box.querySelector('.plate__caption').textContent='demo 实时预览'; this.remove();
    });
    node.dataset.hay=[e.id,e.title,e.author,e.category,e.summary,e.expression,e.extracted_mechanism,e.reuse_hints,
      JSON.stringify(highlights),JSON.stringify(fragment),arr(e.tags).join(' ')].join(' ').toLowerCase();
    node.dataset.cat=e.category||'(未分类)';
    return node;
  }
  const grid=document.getElementById('grid');
  const nodes=entries.map((e,i)=>{const n=plate(e,i);grid.appendChild(n);return n;});
  const chips=document.getElementById('chips'), active=new Set(), q=document.getElementById('q'), empty=document.getElementById('empty');
  catsSorted.forEach(c=>{
    const b=el('<button class="chip" type="button" aria-pressed="false">'+esc(c)+'<span class="chip__n">'+cats[c]+'</span></button>');
    b.onclick=()=>{if(active.has(c))active.delete(c);else active.add(c);b.setAttribute('aria-pressed',active.has(c));apply();};
    chips.appendChild(b);
  });
  function apply(){
    const term=q.value.trim().toLowerCase();let shown=0;
    nodes.forEach(n=>{const ok=(!active.size||active.has(n.dataset.cat))&&(!term||n.dataset.hay.includes(term));n.hidden=!ok;if(ok)shown++;});
    if(!entries.length){empty.hidden=false;empty.innerHTML='<p class="h3">暂无已入库条目</p><p class="small">先从模板创建草稿并直接打开 demo 复核；通过后再构建画廊。</p>';}
    else if(!shown){empty.hidden=false;empty.innerHTML='<p class="h3">没有匹配的条目</p><p class="small">换个关键词，或清掉分类筛选。</p>';}
    else empty.hidden=true;
  }
  q.addEventListener('input',apply); apply();
  if(failed.length){
    const box=document.getElementById('failed');box.hidden=false;
    box.innerHTML='<h2>未入库 '+failed.length+' 条</h2><p class="small">草稿可直接打开复核，不代表已经通过验收。</p><ul>'+failed.map(f=>
      '<li><span class="mono">'+esc(f.dir)+'</span> — '+esc(f.reason)+'<span class="failed-links">'+
      (f.demo?'<a href="'+esc(f.demo)+'" target="_blank" rel="noopener">检查草稿 demo</a>':'')+
      (f.spec?'<a href="'+esc(f.spec)+'">SPEC</a>':'')+(f.readme?'<a href="'+esc(f.readme)+'">README</a>':'')+'</span></li>'
    ).join('')+'</ul>';
  }
})();
</script>
</body>
</html>
